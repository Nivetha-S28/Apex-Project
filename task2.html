<!DOCTYPE html>
<html>
<head>
    <title>Create an Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        
        nav {
            display: flex;
            background-color:brown;
            padding: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: white;
            margin-right: 50px;
            text-decoration:none;
            margin-bottom: 5px;
            
        }

        section {
            padding: 20px;
            border-bottom: 1px solid white;
        }
        h2 {
            color:tomato;
        }

        .form-container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 6px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid gainsboro;
            border-radius: 4px;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        button {
            padding: 12px 20px;
            background: teal;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            border-radius: 4px;
        }

       
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 10px;
        }
        .sidebar { background-color: grey; padding: 10px; }
        .main { background-color: grey; padding: 10px; }

        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
            }
            nav a {
                margin: 4px 0;
            }
        }

        
        #taskList li {
            margin: 6px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

   
    <nav>
        <a href="./task1.html">Home</a>
        <a href="#layout">Chocolate Type</a>
        <a href="#todo">Suggestions</a>
    </nav>

   
    
        <h2>Create Your Account</h2>
        <div class="form-container">
            <form id="accountForm">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">

                <label for="accEmail">Email</label>
                <input type="email" id="accEmail" placeholder="Enter a valid email">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">

                <label for="confirmPass">Confirm Password</label>
                <input type="password" id="confirmPass" placeholder="Confirm password">

                <button type="submit">Sign Up</button>
            </form>
        </div>
    </section>

    
    <section id="layout">
        <h2>Chocolate Type</h2>
        <div class="grid-container">
            <div class="sidebar">Milk Chocolate</div>
            <div class="main">Dark Chocolate</div>
        </div>
    </section>

    
    <section id="todo">
        <h2>Suggestions</h2>
        <input type="text" id="taskInput" placeholder="Add">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
        <p style="font-size: 0.9em; color: #666;">*Click to remove</p>
    </section>

    
    <script>
       
        const form = document.getElementById("accountForm");
        form.addEventListener("submit", function(e) {
            const name = document.getElementById("fullName").value.trim();
            const email = document.getElementById("accEmail").value.trim();
            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPass").value;

            if (name === "" || email === "" || pass === "" || confirm === "") {
                alert("Please fill all fields!");
                e.preventDefault();
                return;
            }
            if (!email.includes("@") || !email.includes(".")) {
                alert("Invalid email format!");
                e.preventDefault();
                return;
            }
            if (pass.length < 6) {
                alert("Password must be at least 6 characters!");
                e.preventDefault();
                return;
            }
            if (pass !== confirm) {
                alert("Passwords do not match!");
                e.preventDefault();
            }
        });

        
        function addTask() {
            const text = document.getElementById("taskInput").value;
            if (text.trim() === "") return;

            let li = document.createElement("li");
            li.textContent = text;
            li.addEventListener("click", function() {
                this.remove();
            });
            document.getElementById("taskList").appendChild(li);
            document.getElementById("taskInput").value = "";
        }
    </script>

</body>
</html>
